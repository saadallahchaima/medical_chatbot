version: '3.9'

# ══════════════════════════════════════════════════════════════════════════════
#  MediAgent — Docker Compose
#  Usage:
#    docker compose up --build          # Premier lancement
#    docker compose up -d               # Mode détaché
#    docker compose logs -f backend     # Logs backend
#    docker compose down -v             # Arrêt + suppression volumes
# ══════════════════════════════════════════════════════════════════════════════

services:

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: mediagent-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - CHROMA_PERSIST_DIR=/data/chroma_db
      - UPLOAD_DIR=/data/uploads
    volumes:
      - mediagent_chroma:/data/chroma_db
      - mediagent_uploads:/data/uploads
    ports:
      - "8000:8000"
    networks:
      - mediagent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  # ── Frontend React/Nginx ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: mediagent-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mediagent-net
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ── ChromaDB (optionnel: serveur dédié) ──────────────────────────────────
  # chromadb:
  #   image: ghcr.io/chroma-core/chroma:0.5.3
  #   container_name: mediagent-chromadb
  #   volumes:
  #     - mediagent_chroma:/chroma/chroma
  #   ports:
  #     - "8001:8000"
  #   networks:
  #     - mediagent-net

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  mediagent_chroma:
    driver: local
  mediagent_uploads:
    driver: local

# ── Network ───────────────────────────────────────────────────────────────
networks:
  mediagent-net:
    driver: bridge
